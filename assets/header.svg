<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="45%" stop-color="#1a1140"/>
      <stop offset="100%" stop-color="#06141f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1100" height="320" fill="url(#bg)"/>
  <circle cx="180" cy="70" r="90" fill="url(#orb)" filter="url(#soft)">
    <animate attributeName="cx" values="140;920;140" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;240;60" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="240" r="110" fill="#ec4899" opacity="0.18" filter="url(#soft)">
    <animate attributeName="cx" values="980;220;980" dur="16s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.7">
    <path d="M0 250 C 140 210, 220 290, 360 250 S 620 190, 780 250 S 980 300, 1100 240">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0 250 C 140 210, 220 290, 360 250 S 620 190, 780 250 S 980 300, 1100 240;
                M0 230 C 160 280, 250 200, 390 250 S 640 300, 800 230 S 980 190, 1100 260;
                M0 250 C 140 210, 220 290, 360 250 S 620 190, 780 250 S 980 300, 1100 240"/>
    </path>
    <path d="M0 270 C 160 310, 280 220, 430 270 S 700 330, 860 260 S 1000 210, 1100 280" opacity="0.45">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 270 C 160 310, 280 220, 430 270 S 700 330, 860 260 S 1000 210, 1100 280;
                M0 255 C 150 210, 300 320, 450 250 S 720 200, 880 290 S 1020 330, 1100 250;
                M0 270 C 160 310, 280 220, 430 270 S 700 330, 860 260 S 1000 210, 1100 280"/>
    </path>
  </g>
  <g font-family="ui-sans-serif, Segoe UI, Helvetica, Arial" fill="#f8fafc" text-anchor="middle">
    <text x="550" y="132" font-size="78" font-weight="800" letter-spacing="14">IOTA</text>
    <text x="550" y="178" font-size="18" fill="#c4b5fd" letter-spacing="6">MUSIC  ·  GAMES  ·  AI  ·  TOOLS</text>
  </g>
  <g fill="#22d3ee">
    <g>
      <path d="M120 90 v28 a8 8 0 1 1 -6 -7.5 V96 l22 -6 v24 a8 8 0 1 1 -6 -7.5 V84z"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M960 70 v22 a6 6 0 1 1 -5 -6 V76 l16 -4 v18 a6 6 0 1 1 -5 -6 V66z"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="40" y="292" width="1020" height="4" rx="2" fill="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
