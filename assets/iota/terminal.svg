<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Iota FM terminal. iota build: queue loaded, zero cgo, voice chat streaming.">
<title>Iota FM: terminal</title>
<style>@keyframes iota-cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
.iota-cursor{animation:iota-cursor 1.1s step-end infinite}
@keyframes iota-show{0%{opacity:0}2%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.iota-cursor{animation:none}}</style>
<defs>
<linearGradient id="iotat-case" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1b1630"/><stop offset="1" stop-color="#0e0b18"/>
</linearGradient>
<linearGradient id="iotat-header" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#2a2344"/><stop offset="1" stop-color="#211a38"/>
</linearGradient>
<linearGradient id="iotat-screen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0d0a1a"/><stop offset="1" stop-color="#080611"/>
</linearGradient>
<linearGradient id="iotat-accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
</defs>
<rect width="800" height="200" fill="url(#iotat-case)"/>
<rect x="4.5" y="4.5" width="791" height="191" rx="6" fill="none" stroke="#3d3460"/>

<rect x="16" y="14" width="768" height="172" rx="5" fill="url(#iotat-screen)" stroke="#2a2344"/>
<rect x="16" y="14" width="768" height="26" rx="5" fill="url(#iotat-header)"/>
<rect x="16" y="30" width="768" height="10" fill="url(#iotat-header)"/>
<circle cx="34" cy="27" r="5" fill="#ec4899"/>
<circle cx="52" cy="27" r="5" fill="#facc15"/>
<circle cx="70" cy="27" r="5" fill="#22d3ee"/>
<text x="400" y="31" font-size="10" letter-spacing="1" fill="#9a8fb8" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">iota — zsh — 80x24</text>
<text x="766" y="31" font-size="10" fill="#4a4070" text-anchor="end" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace">─ &#8491; &#10006;</text>

<g font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="12.5">
<text x="32" y="62" fill="#9a8fb8"><tspan fill="#22d3ee">iota@studio</tspan> <tspan fill="#facc15">~</tspan> <tspan fill="#ec4899">%</tspan> iota build --voice --keep-queue</text>
<text x="32" y="82" fill="#9a8fb8"><tspan fill="#4ade80">✔</tspan> tdlib.json linked · purego · <tspan fill="#f2edfa">cgo=off</tspan></text>
<text x="32" y="102" fill="#9a8fb8"><tspan fill="#4ade80">✔</tspan> 6 handlers registered · mongo reachable</text>
<text x="32" y="122" fill="#9a8fb8"><tspan fill="#facc15">▸</tspan> queue: 4 tracks · volume 62 · loop off</text>
<text x="32" y="142" fill="#9a8fb8"><tspan fill="#22d3ee">iota@studio</tspan> <tspan fill="#facc15">~</tspan> <tspan fill="#ec4899">%</tspan> iota stream "apna time aaya hai"</text>
<text x="32" y="162" fill="#9a8fb8"><tspan fill="#4ade80">─▶</tspan> group voice chat · <tspan fill="#f2edfa">10.2 days on air</tspan></text>
<text x="32" y="182" fill="#9a8fb8"><tspan fill="#22d3ee">iota@studio</tspan> <tspan fill="#facc15">~</tspan> <tspan fill="#ec4899">%</tspan></text>
<rect class="iota-cursor" x="150" y="172" width="8" height="14" fill="#22d3ee" opacity="0.85"/>
</g>

<rect x="636" y="62" width="132" height="104" rx="4" fill="#0a0714" stroke="#2a2344"/>
<g transform="translate(702,114)" fill="none" stroke="#2a2344" stroke-width="1">
<circle r="34"/>
<path d="M-34 0 h68 M0 -34 v68 M-24 -24 l48 48 M-24 24 l48 -48" opacity="0.5"/>
</g>
<g transform="translate(702,114)">
