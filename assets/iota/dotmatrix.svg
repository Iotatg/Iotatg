<style>@keyframes iota-flick{0%,100%{opacity:1}48%{opacity:.72}52%{opacity:1}80%{opacity:.88}}
.iota-flick{animation:iota-flick 4.4s steps(1) infinite}
@keyframes iota-rec{0%,45%{opacity:1}50%,100%{opacity:.15}}
.iota-rec{animation:iota-rec 1.4s step-end infinite}
@media (prefers-reduced-motion:reduce){.iota-flick,.iota-rec{animation:none}}</style>
