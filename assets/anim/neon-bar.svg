<svg xmlns="http://www.w3.org/2000/svg" width="600" height="60" viewBox="0 0 600 60">
  <rect width="600" height="60" rx="8" fill="#0a0a14"/>
  <rect x="20" y="20" width="560" height="20" rx="10" fill="#1a1a2e"/>
  <rect x="20" y="20" width="0" height="20" rx="10" fill="url(#neon-bar-grad)">
    <animate attributeName="width" from="0" to="560" dur="3s" repeatCount="indefinite"/>
  </rect>
  <defs>
    <linearGradient id="neon-bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
</svg>