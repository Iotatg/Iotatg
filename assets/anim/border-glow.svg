<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <rect width="300" height="150" rx="10" fill="#0a0a14"/>
  <rect x="5" y="5" width="290" height="140" rx="8" fill="none" stroke="#7c3aed" stroke-width="2">
    <animate attributeName="stroke" values="#7c3aed;#ec4899;#22d3ee;#7c3aed" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;4;2" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="10" y="10" width="280" height="130" rx="6" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <text x="150" y="80" font-size="18" fill="#c4b5fd" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600">IOTA</text>
  <text x="150" y="105" font-size="10" fill="#7c6faa" text-anchor="middle" font-family="ui-monospace,monospace">animated border</text>
</svg>