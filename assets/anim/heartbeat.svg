<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="20" fill="#0a0a14"/>
  <path d="M100 160 L60 100 L80 100 L80 60 L120 60 L120 100 L140 100 Z" fill="none" stroke="#ec4899" stroke-width="3" stroke-linejoin="round">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="100" cy="60" r="20" fill="#1a1a2e" stroke="#ec4899" stroke-width="2">
    <animate attributeName="r" values="20;22;20" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="65" font-size="12" fill="#f9a8d4" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif">IOTA</text>
</svg>