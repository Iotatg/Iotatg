<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <rect width="400" height="200" rx="10" fill="#0a0a14"/>
  <rect x="20" y="20" width="360" height="160" rx="4" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="20" y1="0" x2="20" y2="200" stroke="#7c3aed" stroke-width="2" opacity="0.8">
    <animate attributeName="x1" from="20" to="380" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="20" to="380" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="20" y1="0" x2="20" y2="200" stroke="#22d3ee" stroke-width="1" opacity="0.4">
    <animate attributeName="x1" from="20" to="380" dur="2s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="x2" from="20" to="380" dur="2s" repeatCount="indefinite" begin="0.1s"/>
  </line>
  <text x="200" y="105" font-size="14" fill="#c4b5fd" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600">IOTA</text>
  <text x="200" y="125" font-size="9" fill="#7c6faa" text-anchor="middle" font-family="ui-monospace,monospace">SCANNING...</text>
</svg>