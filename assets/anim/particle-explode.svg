<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="20" fill="#0a0a14"/>
  <circle cx="100" cy="100" r="8" fill="#7c3aed">
    <animate attributeName="r" values="8;12;8" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="4" fill="#ec4899" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;40;60" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="70" r="4" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="cy" values="70;50;70" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="50" cy="130" r="4" fill="#a855f7" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="cy" values="130;110;130" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="150" cy="140" r="4" fill="#ec4899" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
    <animate attributeName="cy" values="140;120;140" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  <circle cx="80" cy="150" r="3" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="120" cy="50" r="3" fill="#7c3aed" opacity="0.8">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>