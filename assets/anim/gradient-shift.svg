<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <rect width="400" height="200" rx="12" fill="#0a0a14"/>
  <rect width="400" height="200" rx="12">
    <animate attributeName="fill" values="#0a0a14;#1a0a2e;#0a1a2e;#0a0a14" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="20" width="360" height="160" rx="8" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5">
    <animate attributeName="stroke" values="#7c3aed;#ec4899;#22d3ee;#7c3aed" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="200" y="105" font-size="22" fill="#c4b5fd" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700">IOTA</text>
  <text x="200" y="130" font-size="10" fill="#7c6faa" text-anchor="middle" font-family="ui-monospace,monospace">gradient shift</text>
</svg>