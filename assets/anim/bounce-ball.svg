<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <rect width="300" height="150" rx="12" fill="#0a0a14"/>
  <circle cx="150" cy="60" r="18" fill="#7c3aed">
    <animate attributeName="cy" values="60;120;60" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="18;14;18" dur="1s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="150" cy="122" rx="22" ry="4" fill="#ec4899" opacity="0.5">
    <animate attributeName="rx" values="22;10;22" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1s" repeatCount="indefinite"/>
  </ellipse>
  <text x="150" y="145" font-size="10" fill="#7c6faa" text-anchor="middle" font-family="ui-monospace,monospace">IOTA</text>
</svg>