<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="20" fill="#0a0a14"/>
  <g transform="translate(100,100)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1a1a2e" stroke-width="8"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#7c3aed" stroke-width="8" stroke-dasharray="110 40">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ec4899" stroke-width="6" stroke-dasharray="80 30">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="50 20">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>